<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语脉 LinguaPulse · AI 外语口语教练</title>
    <link rel="stylesheet" href="/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-glow"></div>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">🌱</div>
                <div>
                    <h1>语脉 <span class="brand-en">LinguaPulse</span></h1>
                </div>
            </div>

            <div class="sidebar-tabs">
                <button class="tab active" data-tab="practice">练习</button>
                <button class="tab" data-tab="ai">AI 配置</button>
            </div>

            <div class="tab-panel active" id="tab-practice">
                <div class="field-row">
                    <label class="field compact">
                        <span class="field-label">语言</span>
                        <div class="select-wrap">
                            <select id="language">
                                <option value="English">🇺🇸 英语</option>
                                <option value="Chinese">🇨🇳 中文</option>
                                <option value="Japanese">🇯🇵 日语</option>
                                <option value="French">🇫🇷 法语</option>
                                <option value="Spanish">🇪🇸 西班牙语</option>
                            </select>
                        </div>
                    </label>
                    <label class="field compact">
                        <span class="field-label">水平</span>
                        <div class="select-wrap">
                            <select id="level">
                                <option value="A1">A1 入门</option>
                                <option value="A2">A2 基础</option>
                                <option value="B1" selected>B1 中级</option>
                                <option value="B2">B2 中高级</option>
                                <option value="C1">C1 高级</option>
                            </select>
                        </div>
                    </label>
                </div>

                <label class="field compact">
                    <span class="field-label">练习场景</span>
                    <div class="select-wrap">
                        <select id="scenario"></select>
                    </div>
                </label>

                <div class="scenario-preview" id="scenarioInfo">
                    <p id="scenarioDesc"></p>
                    <div class="tags" id="keyPhrases"></div>
                </div>

                <div class="sidebar-actions">
                    <button class="btn primary full-width" id="startBtn">▶ 开始对话</button>
                    <button class="btn end-btn full-width hidden" id="sidebarEndBtn">⏹ 结束练习</button>
                </div>
                <p class="hint" id="modeHint"></p>
            </div>

            <div class="tab-panel" id="tab-ai">
                <label class="field compact">
                    <span class="field-label">AI 服务商</span>
                    <div class="select-wrap">
                        <select id="aiProvider">
                            <option value="deepseek">DeepSeek（推荐）</option>
                            <option value="openai">OpenAI</option>
                            <option value="qwen">通义千问</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                </label>
                <label class="field compact">
                    <span class="field-label">API Key</span>
                    <input type="password" id="apiKey" placeholder="sk-..." class="text-input">
                </label>
                <div class="ai-advanced hidden" id="aiAdvanced">
                    <label class="field compact">
                        <span class="field-label">API 地址</span>
                        <input type="text" id="baseUrl" class="text-input">
                    </label>
                    <label class="field compact">
                        <span class="field-label">模型</span>
                        <input type="text" id="modelName" class="text-input">
                    </label>
                </div>
                <button class="btn primary full-width" id="saveAiBtn">保存并启用 AI</button>
                <p class="hint" id="aiStatusHint"></p>
            </div>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <div class="coach-avatar">A</div>
                <div class="coach-info">
                    <h2>口语教练 Alex</h2>
                    <p id="sessionMeta">选择场景，开启口语练习</p>
                </div>
                <div class="header-actions">
                    <button class="btn ghost" id="cameraBtn" title="打开摄像头">📷 摄像头</button>
                    <button class="btn ghost end-btn hidden" id="endBtn">⏹ 结束练习</button>
                    <button class="btn ghost hidden" id="restartBtn">🔄 重开</button>
                </div>
            </header>

            <div class="chat-body" id="chatBody">
                <div class="messages" id="messages">
                    <div class="welcome">
                        <h3>在真实场景中练口语</h3>
                        <p>左侧选场景，点「开始对话」即可练习</p>
                        <div class="feature-chips">
                            <span>💼 面试</span><span>🌅 习惯</span><span>🎤 演讲</span>
                            <span>🤝 社交</span><span>🎯 目标</span><span>📖 读书会</span>
                        </div>
                    </div>
                </div>

                <div class="camera-pip hidden" id="cameraPip">
                    <video id="cameraVideo" autoplay playsinline muted></video>
                    <div class="camera-bar">
                        <span class="rec-dot"></span>
                        <span id="cameraStatus">摄像头已开启</span>
                        <button class="camera-close" id="closeCamera" title="关闭">×</button>
                    </div>
                </div>
            </div>

            <footer class="input-area">
                <div class="input-hint hidden" id="inputHint"></div>
                <div class="speech-preview hidden" id="speechPreview">
                    <span class="speech-label">🎤 识别中…</span>
                    <span id="speechText"></span>
                </div>
                <div class="input-box">
                    <button class="btn icon-btn" id="micBtn" disabled title="语音输入">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
                        </svg>
                    </button>
                    <textarea id="userInput" placeholder="用目标语言输入或语音回答…" rows="1" disabled></textarea>
                    <button class="btn primary send-btn" id="sendBtn" disabled title="发送">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
            </footer>
        </main>

        <aside class="feedback-panel hidden" id="feedbackPanel">
            <div class="feedback-head">
                <h2>📊 AI 练习评价</h2>
                <button class="close-btn" id="closeFeedback" title="关闭">×</button>
            </div>
            <p class="panel-title" id="feedbackSubtitle"></p>
            <div id="feedbackContent"></div>
        </aside>
    </div>

    <script src="/app.js"></script>
</body>
</html>
